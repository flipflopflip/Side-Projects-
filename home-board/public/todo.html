<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>To Do</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      color: #fff;
      font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
      font-weight: 300;
      min-height: 100%;
    }
    body { padding: 24px 20px 110px; max-width: 560px; margin: 0 auto; }
    h1 {
      font-size: 18px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #999;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 8px;
    }
    #status { font-size: 13px; color: #555; min-height: 18px; margin-bottom: 6px; }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 4px;
      border-bottom: 1px solid #1a1a1a;
      font-size: 21px;
      color: #eee;
    }
    li .box {
      flex: none;
      width: 26px; height: 26px;
      border: 2px solid #555;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #000;
    }
    li.done .box { background: #4a4; border-color: #4a4; }
    li.done .text { text-decoration: line-through; color: #555; }
    li .text { flex: 1; word-break: break-word; }
    li .del {
      flex: none;
      background: none; border: none;
      color: #666; font-size: 22px;
      padding: 6px 10px;
    }
    #empty { color: #555; font-size: 19px; padding: 24px 4px; }
    form {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: #0a0a0a;
      border-top: 1px solid #222;
      display: flex; gap: 10px;
      justify-content: center;
    }
    form input {
      flex: 1;
      max-width: 440px;
      background: #161616;
      border: 1px solid #333;
      border-radius: 10px;
      color: #eee;
      font-size: 18px;
      padding: 12px 14px;
      outline: none;
    }
    form button {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 10px;
      color: #ddd;
      font-size: 24px;
      width: 52px;
    }
  </style>
</head>
<body>
  <h1>Today</h1>
  <div id="status"></div>
  <ul id="list"></ul>
  <div id="empty" hidden>Nothing to do 🎉</div>
  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Add a task…" maxlength="200">
    <button type="submit" aria-label="Add">＋</button>
  </form>

  <script>
    let todos = [];

    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = todos.map((t, i) =>
        `<li class="${t.done ? "done" : ""}" data-i="${i}">` +
        `<span class="box">${t.done ? "✓" : ""}</span>` +
        `<span class="text">${esc(t.text)}</span>` +
        `<button class="del" data-remove="${i}" aria-label="Remove">✕</button></li>`
      ).join("");
      document.getElementById("empty").hidden = todos.length > 0;
    }

    async function load() {
      try {
        const resp = await fetch("/api/todos");
        todos = (await resp.json()).items || [];
        render();
        document.getElementById("status").textContent = "";
      } catch {
        document.getElementById("status").textContent =
          "Can't reach the mirror — are you on the home Wi-Fi?";
      }
    }

    async function save() {
      render();
      try {
        const resp = await fetch("/api/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: todos }),
        });
        const data = await resp.json();
        if (data.items) { todos = data.items; render(); }
      } catch {
        document.getElementById("status").textContent = "Couldn't save — retrying on next change";
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = "";
      save();
    });

    document.getElementById("list").addEventListener("click", (e) => {
      const removeIndex = e.target.dataset.remove;
      if (removeIndex !== undefined) {
        todos.splice(Number(removeIndex), 1);
      } else {
        const li = e.target.closest("li");
        if (!li) return;
        const i = Number(li.dataset.i);
        todos[i].done = !todos[i].done;
      }
      save();
    });

    load();
    setInterval(load, 5000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) load();
    });
  </script>
</body>
</html>
