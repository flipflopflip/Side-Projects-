<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board">

    <section class="region top-left">
      <div id="clock">
        <div class="date" id="clock-date">&nbsp;</div>
        <div class="time"><span id="clock-time">--:--</span><span class="seconds" id="clock-seconds"></span></div>
      </div>

      <div class="module" id="calendar-module">
        <h2>Calendar</h2>
        <div id="calendar-list" class="dimmed">Loading…</div>
      </div>

      <div class="module" id="plants-module" hidden>
        <h2>Water Today</h2>
        <ul id="plants-list"></ul>
      </div>
    </section>

    <section class="region center">
      <div class="module" id="todo-module">
        <h2>Today</h2>
        <ul id="todo-list"></ul>
        <div id="todo-empty" class="dimmed" hidden>Nothing to do</div>
        <form id="todo-form" autocomplete="off">
          <input id="todo-input" type="text" placeholder="Add a task and press Enter" maxlength="200">
        </form>
      </div>
    </section>

    <section class="region top-right">
      <div class="module" id="weather-module">
        <div id="weather-location" class="module-header">&nbsp;</div>
        <div id="weather-current">
          <span class="weather-icon" id="weather-icon"></span>
          <span class="weather-temp" id="weather-temp">--°</span>
        </div>
        <div id="weather-details" class="dimmed"></div>
        <table id="weather-forecast"></table>
      </div>

      <div class="module" id="cinema-module" hidden>
        <h2 id="cinema-name">Cinema</h2>
        <div id="cinema-rotator">
          <div id="cinema-film">&nbsp;</div>
          <div id="cinema-times" class="dimmed"></div>
        </div>
      </div>
    </section>

    <section class="region bottom">
      <div id="news-source" class="dimmed"></div>
      <div id="news-headline">Loading news…</div>
    </section>

  </main>

  <div id="mascot" hidden>
    <div id="mascot-bubble"></div>
    <svg viewBox="0 0 120 140" width="120" height="140" aria-hidden="true">
      <!-- plinth -->
      <ellipse class="m-fill" cx="60" cy="131" rx="27" ry="6"
               stroke="var(--m-line)" fill="var(--m-fill)" stroke-width="2.5"/>
      <!-- body -->
      <g stroke="var(--m-line)" fill="var(--m-fill)" stroke-width="2.5" stroke-linecap="round">
        <rect x="40" y="94" width="40" height="32" rx="9"/>
        <!-- left arm resting -->
        <path d="M40 102 Q28 108 30 118" fill="none"/>
        <!-- right arm: thumbs up -->
        <path d="M80 104 Q94 100 96 90" fill="none"/>
        <path d="M96 90 l0 -7 M96 90 l6 -3" fill="none"/>
        <!-- chest light -->
        <circle class="m-chest" cx="60" cy="108" r="4"/>
      </g>
      <!-- head (bobbles) -->
      <g class="m-head" stroke="var(--m-line)" fill="var(--m-fill)" stroke-width="2.5" stroke-linecap="round">
        <rect x="54" y="82" width="12" height="12"/>
        <rect x="24" y="20" width="72" height="62" rx="16"/>
        <!-- ears -->
        <rect x="17" y="44" width="7" height="14" rx="2"/>
        <rect x="96" y="44" width="7" height="14" rx="2"/>
        <!-- antenna -->
        <line x1="60" y1="20" x2="60" y2="9"/>
        <circle class="m-tip" cx="60" cy="6" r="3.5"/>
        <!-- eyes -->
        <circle class="m-eye" cx="45" cy="49" r="5.5" fill="var(--m-line)" stroke="none"/>
        <circle class="m-eye" cx="75" cy="49" r="5.5" fill="var(--m-line)" stroke="none"/>
        <!-- smile -->
        <path class="m-mouth" d="M44 65 Q60 74 76 65" fill="none"/>
      </g>
    </svg>
  </div>

  <script src="main.js"></script>
</body>
</html>
